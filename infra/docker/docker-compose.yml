version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# EduCode Platform - Full Stack Docker Compose
# Services: API, Frontend, MongoDB, Redis, Code Sandbox Workers, Nginx
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Reverse Proxy / Load Balancer ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: educode-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - api
      - frontend
    networks:
      - educode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend API Server ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: educode-api
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/educode
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      USE_DOCKER_SANDBOX: "true"
      APP_VERSION: "1.0.0"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For code sandbox management
      - api-logs:/app/logs
      - api-uploads:/app/uploads
    networks:
      - educode-network
      - sandbox-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Frontend (React/Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: educode-frontend
    environment:
      VITE_API_URL: ${API_URL}
      VITE_SOCKET_URL: ${SOCKET_URL}
      VITE_CDN_URL: ${CDN_URL}
    networks:
      - educode-network
    restart: unless-stopped

  # ── MongoDB Database ──────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: educode-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: educode
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./infrastructure/docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - educode-network
    restart: unless-stopped
    command: ["mongod", "--auth", "--wiredTigerCacheSizeGB", "2"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin -u ${MONGO_USERNAME} -p ${MONGO_PASSWORD} --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Redis Cache / Session Store ───────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: educode-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis-data:/data
    networks:
      - educode-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Code Execution Sandbox Workers ────────────────────────────────────────
  sandbox-python:
    image: educode/python-sandbox:3.11
    build:
      context: ./infrastructure/docker/sandboxes/python
      dockerfile: Dockerfile
    container_name: educode-sandbox-python
    network_mode: none          # NO network access for security
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
      - seccomp:./infrastructure/docker/seccomp-sandbox.json
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  sandbox-cpp:
    image: educode/gcc-sandbox:13
    build:
      context: ./infrastructure/docker/sandboxes/gcc
      dockerfile: Dockerfile
    container_name: educode-sandbox-cpp
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  sandbox-arduino:
    image: educode/arduino-cli:latest
    build:
      context: ./infrastructure/docker/sandboxes/arduino
      dockerfile: Dockerfile
    container_name: educode-sandbox-arduino
    read_only: true
    tmpfs:
      - /tmp:size=500m
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Hardware Gateway (IoT Device Bridge) ──────────────────────────────────
  hardware-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.hardware
    container_name: educode-hardware-gateway
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      API_URL: http://api:5000
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # USB serial for hardware devices
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /dev:/dev
    privileged: true              # Needed for serial port access
    networks:
      - educode-network
    depends_on:
      - redis
      - api
    restart: unless-stopped

  # ── Analytics Pipeline ─────────────────────────────────────────────────────
  analytics-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: educode-analytics
    environment:
      WORKER_TYPE: analytics
      MONGODB_URI: mongodb://mongo:27017/educode
      REDIS_URL: redis://redis:6379
    networks:
      - educode-network
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── Email Service Worker ───────────────────────────────────────────────────
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: educode-email
    environment:
      WORKER_TYPE: email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      REDIS_URL: redis://redis:6379
      FROM_EMAIL: ${FROM_EMAIL}
      PLATFORM_NAME: EduCode
    networks:
      - educode-network
    depends_on:
      - redis
    restart: unless-stopped

  # ── Monitoring: Prometheus ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: educode-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - educode-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # ── Monitoring: Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: educode-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - educode-network
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["monitoring"]

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  educode-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  sandbox-network:
    driver: bridge
    internal: true  # Isolated, no external access
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/educode/mongo
  mongo-config:
    driver: local
  redis-data:
    driver: local
  api-logs:
    driver: local
  api-uploads:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local