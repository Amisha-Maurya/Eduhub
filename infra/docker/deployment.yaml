---
# ──────────────────────────────────────────────────────────────────────────────
# EduCode Platform - Kubernetes Production Deployment
# Scalable, HA deployment on GKE/EKS/AKS
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: educode
  labels:
    name: educode
    environment: production

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: educode-config
  namespace: educode
data:
  NODE_ENV: "production"
  API_PORT: "5000"
  USE_DOCKER_SANDBOX: "true"
  LOG_LEVEL: "info"
  ALLOWED_ORIGINS: "https://app.educode.io,https://educode.io"
  APP_VERSION: "1.0.0"

---
# ── API Deployment ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: educode-api
  namespace: educode
  labels:
    app: educode-api
    tier: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: educode-api
  template:
    metadata:
      labels:
        app: educode-api
        tier: backend
    spec:
      serviceAccountName: educode-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: gcr.io/educode-prod/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: educode-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: educode-secrets
                  key: MONGODB_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: educode-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: educode-secrets
                  key: JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: educode-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: educode-api

---
# ── API Service ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: educode-api-svc
  namespace: educode
spec:
  selector:
    app: educode-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: ClusterIP

---
# ── API Horizontal Pod Autoscaler ─────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: educode-api-hpa
  namespace: educode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: educode-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

---
# ── Frontend Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: educode-frontend
  namespace: educode
  labels:
    app: educode-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: educode-frontend
  template:
    metadata:
      labels:
        app: educode-frontend
    spec:
      containers:
        - name: frontend
          image: gcr.io/educode-prod/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
# ── Ingress (with cert-manager TLS) ──────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: educode-ingress
  namespace: educode
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
spec:
  tls:
    - hosts:
        - app.educode.io
        - api.educode.io
      secretName: educode-tls
  rules:
    - host: app.educode.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educode-frontend-svc
                port:
                  number: 80
    - host: api.educode.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educode-api-svc
                port:
                  number: 80

---
# ── Code Sandbox Job Template ─────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: code-sandbox-template
  namespace: educode
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
      containers:
        - name: sandbox
          image: gcr.io/educode-prod/python-sandbox:3.11
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: code-volume
              mountPath: /code
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code-volume
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi